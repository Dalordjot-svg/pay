  <style>

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #08080c;
      color: #f1f5f9;

    }

    /* --- Visual Editor & Content Typography --- */
    .word-editor {
      min-height: 140px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #e2e8f0;
      font-size: 13.5px;
      line-height: 1.7;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .word-editor:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }
    .word-editor:empty:before {
      content: attr(data-placeholder);
      color: #475569;
      pointer-events: none;
      display: block;
    }

    /* Стили форматирования внутри редактора и карточек */
    .rich-content mark, .word-editor mark {
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-weight: 600;
    }
    .rich-content b, .rich-content strong, .word-editor b, .word-editor strong {
      font-weight: 700;
      color: #ffffff;
    }
    .rich-content u, .word-editor u {
      text-decoration-color: #f59e0b;
      text-underline-offset: 3px;
    }
    .rich-content s, .word-editor s {
      color: #94a3b8;
    }
    .rich-content .chef-color-danger, .word-editor .chef-color-danger {

    <div class="w-full max-w-3xl max-h-[92vh] bento-card border-amber-500/40 p-5 sm:p-6 shadow-2xl flex flex-col space-y-4 overflow-hidden bg-[#121219]">

          <button type="button" onmousedown="event.preventDefault(); execWordCmd('strikeThrough');" title="Зачеркнутый" class="tb-btn line-through">

          <div class="tb-divider"></div>

  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, dur = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function showToast(msg, icon = '👑') {
      playTone(880, 0.1);
      const t = document.getElementById('adminToast');
      document.getElementById('toastMsg').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      t.classList.remove('-translate-y-24', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.remove('translate-y-0', 'opacity-100');
        t.classList.add('-translate-y-24', 'opacity-0');
      }, 2400);
    }

    /* Baseline Recipes with visual markup */
    const BASELINE_RECIPES = {
      meringue: {
        id: 'meringue',
        title: 'Меренговый рулет',
        emoji: '🍓',
        isPopular: true,
        ovenTemp: '150°C',
        bakeMinutes: 50,
        ingredients: `<ul>
<li><b>Белки яичные</b> (в сухую чашу) — 6 шт. (200–220 г)</li>
<li>Сахар (в меренгу) — <b>280 г</b></li>
<li>Лимонный сок — 8 мл</li>
<li>Крахмал кукурузный — 8 г</li>
<li>Клубника замороженная — 100 г</li>
<li>Творожный сыр (крем) — 200 г</li>
<li>Сливки 33% (крем) — 100 г</li>
<li>Сахар (в крем) — 50 г</li>
</ul>`,
        instructions: `<ol>
<li><mark>Тщательно обезжирить</mark> и вытереть насухо чашу миксера и венчик. Разбить 6 яиц. <span class="chef-color-danger">Духовку заранее НЕ включать (холодный старт!)</span>.</li>
<li><b>0:00–5:00</b> — включить 1-ю скорость, плавно довести до устойчивой белой пены.</li>
<li>На отметке <b>5:00</b> влить 8 мл лимонного сока.</li>
<li>С 6-й минуты разгон: строго <u>+1 скорость в минуту</u>.</li>
<li>На отметке <b>7:00</b> тонкой струйкой всыпать весь сахар (280 г).</li>
<li>На 8:50–9:00 остановить миксер: масса держит плотный клюв.</li>
<li>На 9:00 всыпать кукурузный крахмал (8 г) и довзбивать ровно 1 минуту.</li>
<li>Выложить готовую меренгу на силиконовый коврик ровным прямоугольником.</li>
<li><div class="chef-callout">🔥 Поставить противень в ХОЛОДНУЮ духовку, включить 150°C ровно на 50 минут!</div></li>
<li>Остывшую меренгу перевернуть, смазать кремом и свернуть рулет.</li>
</ol>`
      },
      cheesecake: {
        id: 'cheesecake',
        title: 'Классический чизкейк',
        emoji: '🧀',
        isPopular: true,
        ovenTemp: '175°C',
        bakeMinutes: 50,
        ingredients: `<ul>
<li>Печенье («Юбилейное») — 16 шт. (~180 г)</li>
<li>Сливочное масло (растопить) — 150 г</li>
<li><b>Творожный сыр</b> — 550 г</li>
<li>Сливки 33% — 150 г</li>
<li>Сахар — 120 г</li>
<li>Крахмал кукурузный — 10 г</li>
<li>Яйца куриные — 2 шт.</li>
<li>Сметана 20% — 2 ст. л.</li>
</ul>`,
        instructions: `<ol>
<li>Печенье измельчить в крошку со 150 г масла, утрамбовать основу и убрать в морозилку на 30 мин.</li>
<li>Смешать сыр, сливки, сахар и крахмал. По одному ввести яйца и сметану.</li>
<li><mark>Вымешивать на минимальной скорости</mark>, чтобы не насыщать воздухом.</li>
<li><div class="chef-callout">Обязательно оставить массу на 30–60 минут на столе, чтобы вышли микропузыри!</div></li>
<li>Залить на замороженную основу и выпекать при <span class="chef-color-gold">175°C ровно 50 минут</span>.</li>
</ol>`
      },
      banana: {
        id: 'banana',
        title: 'Банановый хлеб',
        emoji: '🍌',
        isPopular: false,
        ovenTemp: '175°C',
        bakeMinutes: 50,
        ingredients: `<ul>
<li>Бананы спелые — 2 шт.</li>
<li>Яйца куриные — 2 шт.</li>
<li>Масло сливочное растопленное — 130 г</li>
<li>Сахар — 150 г (тесто) + 25 г (крем)</li>
<li>Мука пшеничная — 250 г</li>
<li>Соль мелкая — 1 ч. л. без горки</li>
<li><span class="chef-color-danger">Сода пищевая — 1 ч. л. С ГОРКОЙ</span></li>
</ul>`,
        instructions: `<ol>
<li>Разогреть духовку заранее до <span class="chef-color-gold">175°C</span>.</li>
<li>В блендере взбить бананы с яйцами в шелковистую эмульсию.</li>
<li>Соединить с растопленным маслом, сахаром и мукой.</li>
<li>Всыпать соль и соду с горкой, вымешивать <u>не дольше 15 секунд</u>!</li>
<li><span class="chef-color-danger">МОМЕНТАЛЬНО</span> перелить в форму и поставить в печь на 50 минут.</li>
</ol>`
      }
    };

    window.recipes = {};
    window.currentFilter = 'all';
    window.editingId = null;
    window.expandedAdminCards = {};

    /* --- Word WYSIWYG Engine --- */
    function execWordCmd(command, val = null) {
      playTone(650, 0.05);
      document.execCommand(command, false, val);
    }

    // Toggle Highlighter (Mark)
    function toggleHighlight() {
      playTone(700, 0.05);
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
        showToast('Выделите текст для выделения маркером', 'ℹ️');
        return;
      }

      let parentNode = sel.anchorNode;
      if (parentNode.nodeType === Node.TEXT_NODE) parentNode = parentNode.parentNode;

      // Если уже внутри <mark> — отменяем / снимаем
      const existingMark = parentNode.closest('mark');
      if (existingMark) {
        const text = existingMark.innerHTML;
        existingMark.outerHTML = text;
        return;
      }

      // Оборачиваем в <mark>
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.appendChild(range.extractContents());
      range.insertNode(mark);
      sel.removeAllRanges();
    }

    // Mutually Exclusive Colors (Красный, Золотой, Зеленый заменяют друг друга без наслаивания)
    function toggleExclusiveColor(colorType) {
      playTone(740, 0.05);
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
        showToast('Выделите текст мышкой для смены цвета', 'ℹ️');
        return;
      }

      const className = `chef-color-${colorType}`;
      let parentNode = sel.anchorNode;
      if (parentNode.nodeType === Node.TEXT_NODE) parentNode = parentNode.parentNode;

      const existingColoredSpan = parentNode.closest('.chef-color-danger, .chef-color-gold, .chef-color-emerald');
      
      // Если повторно нажимаем тот же цвет — снимаем его (toggle)
      if (existingColoredSpan && existingColoredSpan.classList.contains(className)) {
        existingColoredSpan.outerHTML = existingColoredSpan.innerHTML;
        return;
      }

      // Если был другой цвет — меняем класс без создания нового слоя
      if (existingColoredSpan) {
        existingColoredSpan.classList.remove('chef-color-danger', 'chef-color-gold', 'chef-color-emerald');
        existingColoredSpan.classList.add(className);
        return;
      }

      // Оборачиваем в чистый span
      const range = sel.getRangeAt(0);
      const span = document.createElement('span');
      span.className = className;
      span.appendChild(range.extractContents());
      range.insertNode(span);
      sel.removeAllRanges();
    }

    // Вставка цитаты / акцентного блока
    function insertCalloutBox() {
      playTone(580, 0.06);
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;

      const range = sel.getRangeAt(0);
      let content = range.extractContents();
      
      const div = document.createElement('div');
      div.className = 'chef-callout';
      if (!content.textContent.trim()) {
        div.innerHTML = '💡 <b>Важная заметка шефа:</b> Введите рекомендацию здесь...';
      } else {
        div.appendChild(content);
      }

      range.insertNode(div);
      sel.removeAllRanges();
    }

    // Полная очистка стилей выделенного участка
    function clearCustomFormatting() {
      playTone(400, 0.08);
      document.execCommand('removeFormat', false, null);
      
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;

      let parentNode = sel.anchorNode;
      if (parentNode.nodeType === Node.TEXT_NODE) parentNode = parentNode.parentNode;

      const styledParent = parentNode.closest('mark, .chef-color-danger, .chef-color-gold, .chef-color-emerald, .chef-callout');
      if (styledParent) {
        styledParent.outerHTML = styledParent.innerHTML;
      }
      showToast('Форматирование очищено', '🧹');
    }

    function toggleCardAccordion(id, e) {
      if (e) e.stopPropagation();
      playTone(520, 0.04);
      window.expandedAdminCards[id] = !window.expandedAdminCards[id];
      renderRecipes();
    }

    function initAdmin() {
      try {
        const raw = localStorage.getItem('pastry_recipes_simple');
        if (raw) window.recipes = JSON.parse(raw);
        else window.recipes = JSON.parse(JSON.stringify(BASELINE_RECIPES));
      } catch (e) {
        window.recipes = JSON.parse(JSON.stringify(BASELINE_RECIPES));
      }
      renderRecipes();

      function connect() {
        if (!window.fbDb || !window.fbRef || !window.fbOnValue) return;
        const recRef = window.fbRef(window.fbDb, 'pastry_handbook/recipes_simple');

        window.fbOnValue(recRef, (snap) => {
          const val = snap.val();
          if (val && Object.keys(val).length > 0) {
            window.recipes = val;
            try { localStorage.setItem('pastry_recipes_simple', JSON.stringify(val)); } catch (e) {}
          } else {
            window.fbSet(recRef, BASELINE_RECIPES);
          }
          renderRecipes();
          document.getElementById('cloudStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase онлайн';
        }, (err) => {
          console.warn('Firebase error:', err);
          document.getElementById('cloudStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Локальный кэш';
        });
      }

      if (window.fbDb) connect();
      else window.addEventListener('firebase-ready', connect);
    }

    function setFilter(f) {
      playTone(550, 0.05);
      window.currentFilter = f;
      ['all', 'popular', 'regular'].forEach(t => {
        const b = document.getElementById(`btn-${t}`);
        if (t === f) b.className = "px-3.5 py-1.5 rounded-xl bg-amber-500 text-black font-bold transition";
        else b.className = "px-3.5 py-1.5 rounded-xl bg-white/5 text-slate-300 hover:text-white border border-white/10 font-bold transition";
      });
      renderRecipes();
    }

    function togglePopular(id) {
      if (!window.recipes[id]) return;
      playTone(620, 0.06);
      window.recipes[id].isPopular = !window.recipes[id].isPopular;
      saveAllToStorage();
      renderRecipes();
      showToast(window.recipes[id].isPopular ? 'Отмечен как популярный 🔥' : 'Снят статус популярного', '⭐');
    }

    function renderRecipes() {
      const container = document.getElementById('recipesContainer');
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      container.innerHTML = '';

      let list = Object.values(window.recipes);

      document.getElementById('c-all').innerText = list.length;
      document.getElementById('c-pop').innerText = list.filter(r => r.isPopular).length;
      document.getElementById('c-reg').innerText = list.filter(r => !r.isPopular).length;

      if (q) {
        list = list.filter(r => 
          (r.title || '').toLowerCase().includes(q) ||
          (r.ingredients || '').toLowerCase().includes(q) ||
          (r.instructions || '').toLowerCase().includes(q)
        );
      }

      if (window.currentFilter === 'popular') list = list.filter(r => r.isPopular);
      else if (window.currentFilter === 'regular') list = list.filter(r => !r.isPopular);
      else list.sort((a, b) => (b.isPopular ? 1 : 0) - (a.isPopular ? 1 : 0));

      if (list.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 bento-card">Рецепты не найдены</div>`;
        return;
      }

      list.forEach(r => {
        const isExp = !!window.expandedAdminCards[r.id];
        const card = document.createElement('div');
        card.className = `rounded-[28px] bento-card overflow-hidden transition-all duration-200 ${isExp ? 'border-amber-500/30 shadow-xl' : 'hover:border-white/20'}`;

        card.innerHTML = `
          <!-- Header Card -->
          <div onclick="toggleCardAccordion('${r.id}')" class="p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none">
            <div class="flex items-center gap-3.5">
              <span class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-2xl shrink-0">
                ${r.emoji || '🧁'}
              </span>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-base sm:text-lg font-bold text-white">${r.title}</h3>
                  <button onclick="event.stopPropagation(); togglePopular('${r.id}')" 
                          class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold border transition ${r.isPopular ? 'bg-amber-500/20 text-amber-400 border-amber-500/40' : 'bg-white/5 text-slate-400 border-white/10 hover:text-white'}">
                    ${r.isPopular ? '🔥 Топ десерт' : 'Обычный'}
                  </button>
                </div>
                <div class="text-xs text-slate-400 font-mono mt-0.5">
                  🔥 ${r.ovenTemp || '175°C'} • ⏱ ${r.bakeMinutes || 50} мин
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="event.stopPropagation(); openRecipeEditor('${r.id}')" 
                      class="px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-amber-500 hover:text-black text-white text-xs font-bold transition flex items-center gap-1.5 border border-white/10 shadow-sm">
                <i class="fa-solid fa-pen-to-square"></i> Редактировать
              </button>
              <button onclick="toggleCardAccordion('${r.id}', event)" 
                      class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center text-xs transition-transform duration-200 ${isExp ? 'rotate-180 text-amber-400' : ''}">
                <i class="fa-solid fa-chevron-down"></i>
              </button>
            </div>
          </div>

          <!-- Раскрытый красивый текст рецепта -->
          ${isExp ? `
            <div class="px-5 pb-5 pt-1 border-t border-white/5 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="p-4 rounded-2xl bg-black/40 border border-white/5 space-y-2">
                <span class="text-[10px] font-mono font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                  <i class="fa-solid fa-scale-balanced"></i> Ингредиенты:
                </span>
                <div class="rich-content text-xs text-slate-300 leading-relaxed">${r.ingredients || '—'}</div>
              </div>

              <div class="p-4 rounded-2xl bg-black/40 border border-white/5 space-y-2">
                <span class="text-[10px] font-mono font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                  <i class="fa-solid fa-list-check"></i> Инструкция:
                </span>
                <div class="rich-content text-xs text-slate-200 leading-relaxed">${r.instructions || '—'}</div>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function openRecipeEditor(id) {
      playTone(520, 0.08);
      window.editingId = id;
      const modal = document.getElementById('editorModal');
      const delBtn = document.getElementById('btnDelete');

      if (id && window.recipes[id]) {
        const r = window.recipes[id];
        document.getElementById('ed-modal-title').innerText = 'Редактирование: ' + r.title;
        document.getElementById('ed-emoji').value = r.emoji || '🍰';
        document.getElementById('ed-emoji-preview').innerText = r.emoji || '🍰';
        document.getElementById('ed-title').value = r.title || '';
        document.getElementById('ed-ovenTemp').value = r.ovenTemp || '175°C';
        document.getElementById('ed-bakeMinutes').value = r.bakeMinutes || 50;
        document.getElementById('ed-isPopular').checked = !!r.isPopular;
        
        // Вставляем HTML напрямую в визуальные редакторы
        document.getElementById('ed-ingredients').innerHTML = r.ingredients || '';
        document.getElementById('ed-instructions').innerHTML = r.instructions || '';
        delBtn.classList.remove('hidden');
      } else {
        document.getElementById('ed-modal-title').innerText = 'Новый десерт';
        document.getElementById('ed-emoji').value = '✨';
        document.getElementById('ed-emoji-preview').innerText = '✨';
        document.getElementById('ed-title').value = '';
        document.getElementById('ed-ovenTemp').value = '175°C';
        document.getElementById('ed-bakeMinutes').value = 45;
        document.getElementById('ed-isPopular').checked = false;
        
        document.getElementById('ed-ingredients').innerHTML = '';
        document.getElementById('ed-instructions').innerHTML = '';
        delBtn.classList.add('hidden');
      }

      modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeRecipeEditor() {
      playTone(450, 0.06);
      document.getElementById('editorModal').classList.add('opacity-0', 'pointer-events-none');
    }

    function saveRecipe() {
      const title = document.getElementById('ed-title').value.trim();
      if (!title) {
        showToast('Введите название десерта!', '⚠️');
        return;
      }

      const id = window.editingId || ('rec_' + Date.now());
      const data = {
        id,
        title,
        emoji: document.getElementById('ed-emoji').value.trim() || '🧁',
        ovenTemp: document.getElementById('ed-ovenTemp').value.trim() || '175°C',
        bakeMinutes: parseInt(document.getElementById('ed-bakeMinutes').value) || 50,
        isPopular: document.getElementById('ed-isPopular').checked,
        // Забираем чистый HTML прямо из визуального редактора
        ingredients: document.getElementById('ed-ingredients').innerHTML.trim(),
        instructions: document.getElementById('ed-instructions').innerHTML.trim()
      };

      window.recipes[id] = data;
      saveAllToStorage();
      closeRecipeEditor();
      renderRecipes();
      showToast('Рецепт сохранён!', '💾');
    }

    function deleteCurrentRecipe() {
      const id = window.editingId;
      if (!id) return;

      delete window.recipes[id];
      saveAllToStorage();
      closeRecipeEditor();
      renderRecipes();
      showToast('Рецепт удалён', '🗑');
    }

    function saveAllToStorage() {
      try {
        localStorage.setItem('pastry_recipes_simple', JSON.stringify(window.recipes));
      } catch (e) {}

      if (window.fbDb && window.fbRef && window.fbSet) {
        window.fbSet(window.fbRef(window.fbDb, 'pastry_handbook/recipes_simple'), window.recipes);
      }
    }

    window.addEventListener('DOMContentLoaded', initAdmin);
  </script>
</body>
</html>
