<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COFFEEMAN • Конструктор зала</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .blueprint-canvas {
      background-color: #0b0b0e;
      background-image: 
        radial-gradient(circle, #262630 1px, transparent 1px),
        linear-gradient(to right, #181820 1px, transparent 1px),
        linear-gradient(to bottom, #181820 1px, transparent 1px);
      background-size: 20px 20px, 80px 80px, 80px 80px;
    }
    .drawn-item {
      position: absolute;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: grab;
      transform-origin: center center;
    }
    .drawn-item:active {
      cursor: grabbing;
    }
    .drawn-item.selected {
      outline: 2px dashed #c084fc !important;
      outline-offset: 4px;
      z-index: 50 !important;
    }
    #previewBox {
      position: absolute;
      pointer-events: none;
      border: 2px dashed #a855f7;
      background: rgba(168, 85, 247, 0.2);
      display: none;
      z-index: 60;
    }
    .window-glass {
      background: repeating-linear-gradient(
        90deg,
        rgba(56, 189, 248, 0.35),
        rgba(56, 189, 248, 0.35) 16px,
        rgba(14, 165, 233, 0.75) 16px,
        rgba(14, 165, 233, 0.75) 20px
      );
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }
    .plant-divider {
      background: repeating-linear-gradient(
        45deg,
        #14532d,
        #14532d 10px,
        #166534 10px,
        #166534 20px
      );
      border: 2px solid #22c55e;
      border-radius: 12px;
    }
    .sofa-item {
      background: #78350f;
      border: 2px solid #92400e;
      border-radius: 14px;
      position: relative;
    }
    .sofa-back-strip {
      position: absolute;
      top: 0; left: 0; right: 0; height: 30%;
      background: #451a03;
      border-radius: 10px 10px 0 0;
    }
    /* Табуретка / Барный стул */
    .stool-item {
      background: radial-gradient(circle, #b45309 35%, #78350f 100%);
      border: 2.5px solid #d97706;
      border-radius: 9999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      position: relative;
    }
    .stool-inner {
      position: absolute;
      inset: 22%;
      border-radius: 9999px;
      border: 1px dashed rgba(254, 215, 170, 0.4);
    }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 flex flex-col h-[100dvh] overflow-hidden select-none">

  <!-- Header -->
  <header class="bg-stone-900 text-white px-4 py-2 shrink-0 flex items-center justify-between border-b border-stone-800 z-30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-8 h-8 rounded-xl bg-purple-600 text-white font-black flex items-center justify-center text-sm active:scale-95 transition">
        📐
      </a>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-sm tracking-wide">COFFEEMAN</h1>
          <span class="text-[10px] bg-purple-900 text-purple-200 px-1.5 py-0.2 rounded font-bold">КОНСТРУКТОР</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 text-xs font-bold">
      <span id="localSaveBadge" class="text-[11px] text-emerald-400 font-mono hidden sm:inline">💾 Автосохранено</span>

      <div class="flex items-center gap-1.5 bg-stone-800 px-2.5 py-1.5 rounded-xl border border-stone-700">
        <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="syncText" class="font-mono text-stone-300">Подключение...</span>
      </div>

      <button onclick="downloadBackupJSON()" title="Скачать копию на ПК" class="px-2.5 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-xl transition">
        📥 Резервная копия
      </button>

      <button onclick="saveFloorplan()" class="px-4 py-1.5 bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white rounded-xl shadow-md transition flex items-center gap-1.5 active:scale-95">
        <span>☁️</span> <span>Загрузить в облако</span>
      </button>

      <a href="index.html" class="px-2.5 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-xl transition">
        Выход
      </a>
    </div>
  </header>

  <!-- Workspace -->
  <div class="flex-1 flex min-h-0 relative overflow-hidden">

    <!-- LEFT PALETTE -->
    <aside class="w-52 bg-stone-900/95 border-r border-stone-800 p-2.5 flex flex-col gap-3 shrink-0 z-20 overflow-y-auto">
      <div>
        <span class="text-[9px] uppercase font-black text-stone-500 tracking-wider">Инструменты</span>
        <div class="grid grid-cols-2 gap-1 mt-1">
          <button onclick="setTool('select')" id="tool-select" class="tool-btn p-2 rounded-xl bg-purple-600 text-white text-xs font-bold flex items-center justify-center gap-1">
            <span>👆</span> <span>Выбор</span>
          </button>
          <button onclick="setTool('pan')" id="tool-pan" class="tool-btn p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center justify-center gap-1">
            <span>✋</span> <span>Рука</span>
          </button>
        </div>
      </div>

      <div>
        <span class="text-[9px] uppercase font-black text-stone-500 tracking-wider">Столы и мебель</span>
        <div class="grid grid-cols-1 gap-1 mt-1">
          <button onclick="setTool('draw_table_round')" id="tool-draw_table_round" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-4 rounded-full border-2 border-amber-400"></span> <span>Круглый стол</span>
          </button>
          <button onclick="setTool('draw_table_rect')" id="tool-draw_table_rect" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-3 rounded-sm border-2 border-amber-400"></span> <span>Стол обычный</span>
          </button>
          <button onclick="setTool('draw_sofa')" id="tool-draw_sofa" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-3 bg-amber-900 border border-amber-600 rounded"></span> <span>Мягкий диван</span>
          </button>
          <!-- ТАБУРЕТКА -->
          <button onclick="setTool('draw_stool')" id="tool-draw_stool" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-amber-600 border border-amber-400 shadow-xs"></span> <span>Табуретка / Барный стул</span>
          </button>
        </div>
      </div>

      <div>
        <span class="text-[9px] uppercase font-black text-stone-500 tracking-wider">Препятствия & Окна</span>
        <div class="grid grid-cols-1 gap-1 mt-1">
          <button onclick="setTool('draw_window')" id="tool-draw_window" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-1.5 bg-sky-400 rounded-sm"></span> <span>Окно (под углом)</span>
          </button>
          <button onclick="setTool('draw_plant')" id="tool-draw_plant" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-2 bg-emerald-600 rounded"></span> <span>Цветы / Перегородка</span>
          </button>
          <button onclick="setTool('draw_wall')" id="tool-draw_wall" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-2 bg-stone-600 rounded-sm"></span> <span>Стена</span>
          </button>
          <button onclick="setTool('draw_bar')" id="tool-draw_bar" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-4 h-3 bg-amber-950 border border-amber-700 rounded"></span> <span>Барная стойка</span>
          </button>
          <button onclick="setTool('draw_column')" id="tool-draw_column" class="tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-stone-500"></span> <span>Колонна</span>
          </button>
        </div>
      </div>

      <div class="mt-auto pt-2 border-t border-stone-800 space-y-1.5">
        <label class="w-full py-1.5 px-2 bg-stone-800 hover:bg-stone-700 text-stone-300 text-[11px] font-bold rounded-xl transition cursor-pointer flex items-center justify-center gap-1">
          <span>📤 Загрузить файл</span>
          <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importBackupJSON(event)">
        </label>
        <button onclick="clearEverything()" class="w-full py-1.5 px-2 bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 text-rose-200 text-[11px] font-bold rounded-xl transition">
          Очистить карту
        </button>
      </div>
    </aside>

    <!-- CENTER CANVAS -->
    <div id="canvasViewport" class="flex-1 blueprint-canvas relative overflow-hidden cursor-default">
      <div id="canvasWorld" class="absolute top-0 left-0 w-[4000px] h-[3000px] origin-top-left">
        <div id="previewBox"></div>
        <div id="elementsLayer" class="w-full h-full relative"></div>
      </div>

      <!-- Zoom controls -->
      <div class="absolute bottom-3 left-3 z-20 flex items-center gap-1 bg-stone-900/90 border border-stone-800 p-1 rounded-xl shadow-xl">
        <button onclick="adjustZoom(0.1)" class="w-7 h-7 bg-stone-800 hover:bg-stone-700 rounded-lg font-bold text-white text-sm">+</button>
        <span id="zoomVal" class="text-xs font-mono font-bold px-2 text-stone-300">100%</span>
        <button onclick="adjustZoom(-0.1)" class="w-7 h-7 bg-stone-800 hover:bg-stone-700 rounded-lg font-bold text-white text-sm">-</button>
      </div>
    </div>

    <!-- RIGHT INSPECTOR -->
    <aside id="inspector" class="w-64 bg-stone-900/95 border-l border-stone-800 p-3.5 flex flex-col justify-between shrink-0 z-20 overflow-y-auto">
      <div class="space-y-3.5">
        <div class="border-b border-stone-800 pb-2 flex items-center justify-between">
          <span class="text-[10px] uppercase font-bold text-purple-400">Настройки</span>
          <span id="inspTypeBadge" class="text-[9px] bg-stone-800 text-stone-300 px-1.5 py-0.5 rounded font-mono font-bold">—</span>
        </div>

        <div id="inspEmpty" class="text-xs text-stone-500 py-8 text-center">
          Выберите элемент для поворота или изменения размера
        </div>

        <div id="inspForm" class="hidden space-y-3 text-xs">
          <div id="tableNameField">
            <label class="block text-[10px] text-stone-400 mb-1">Номер стола:</label>
            <input type="text" id="inspName" oninput="editProp('name', this.value)" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-2 text-white font-bold outline-none focus:ring-1 focus:ring-purple-500">
          </div>

          <!-- Свободный поворот угла -->
          <div class="bg-stone-950/70 p-2.5 rounded-xl border border-stone-800 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-[10px] font-bold text-amber-400">Угол поворота:</label>
              <span id="inspAngleVal" class="font-mono font-bold text-xs text-white">0°</span>
            </div>
            <input type="range" id="inspRotationSlider" min="0" max="360" step="1" oninput="editRotation(parseInt(this.value))" class="w-full accent-purple-500 cursor-pointer">
            <div class="grid grid-cols-4 gap-1 pt-1">
              <button onclick="addRotation(-45)" class="py-1 bg-stone-800 hover:bg-stone-700 rounded text-[10px] font-bold">-45°</button>
              <button onclick="addRotation(-15)" class="py-1 bg-stone-800 hover:bg-stone-700 rounded text-[10px] font-bold">-15°</button>
              <button onclick="addRotation(15)" class="py-1 bg-stone-800 hover:bg-stone-700 rounded text-[10px] font-bold">+15°</button>
              <button onclick="addRotation(45)" class="py-1 bg-stone-800 hover:bg-stone-700 rounded text-[10px] font-bold">+45°</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-stone-400 mb-0.5">Размер (W):</label>
              <input type="number" id="inspW" step="5" oninput="editProp('w', parseInt(this.value))" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-1.5 font-mono text-white outline-none">
            </div>
            <div>
              <label class="block text-[10px] text-stone-400 mb-0.5">Размер (H):</label>
              <input type="number" id="inspH" step="5" oninput="editProp('h', parseInt(this.value))" class="w-full bg-stone-950 border border-stone-700 rounded-lg p-1.5 font-mono text-white outline-none">
            </div>
          </div>
        </div>
      </div>

      <div id="inspDeleteBox" class="hidden pt-3 border-t border-stone-800">
        <button onclick="deleteActiveObject()" class="w-full py-2.5 bg-rose-950/80 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
          <span>🗑️</span> <span>Удалить элемент</span>
        </button>
      </div>
    </aside>

  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { initFirebaseAuth, subscribeToCloudTables, saveTablesToCloud } from "./firebase.js";
    import { TABLES_INITIAL } from "./menu.js";

    let activeTool = 'select';
    let scale = 1;
    let panX = 40;
    let panY = 40;

    let tables = [];
    let obstacles = [];
    let selectedId = null;

    let isDrawing = false;
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let drawStartX = 0, drawStartY = 0;

    let draggingObj = null;
    let draggingEl = null;
    let dragStartMouseX = 0, dragStartMouseY = 0;
    let dragStartObjX = 0, dragStartObjY = 0;

    const viewport = document.getElementById('canvasViewport');
    const world = document.getElementById('canvasWorld');
    const elementsLayer = document.getElementById('elementsLayer');
    const previewBox = document.getElementById('previewBox');

    function triggerAutoSave() {
      try {
        localStorage.setItem('coffeeman_local_backup', JSON.stringify({ tables, obstacles, time: Date.now() }));
        const badge = document.getElementById('localSaveBadge');
        if (badge) {
          badge.textContent = "💾 Сохранено локально";
          badge.classList.remove('opacity-50');
        }
      } catch (e) {}
    }

    function applyTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      document.getElementById('zoomVal').textContent = `${Math.round(scale * 100)}%`;
    }

    window.adjustZoom = (delta) => {
      scale = Math.max(0.3, Math.min(2.5, scale + delta));
      applyTransform();
    };

    window.setTool = (tool) => {
      activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.className = "tool-btn w-full p-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs font-bold flex items-center gap-2";
      });
      const activeBtn = document.getElementById(`tool-${tool}`);
      if (activeBtn) {
        activeBtn.className = "tool-btn w-full p-2 rounded-xl bg-purple-600 text-white text-xs font-bold flex items-center gap-2 shadow-sm";
      }

      if (tool === 'pan') viewport.style.cursor = 'grab';
      else if (tool === 'select') viewport.style.cursor = 'default';
      else viewport.style.cursor = 'crosshair';
    };

    function getCanvasCoords(clientX, clientY) {
      const rect = viewport.getBoundingClientRect();
      const x = (clientX - rect.left - panX) / scale;
      const y = (clientY - rect.top - panY) / scale;
      return {
        x: Math.round(x / 5) * 5,
        y: Math.round(y / 5) * 5
      };
    }

    viewport.addEventListener('pointerdown', (e) => {
      if (e.target !== viewport && e.target !== world && e.target !== elementsLayer) {
        return;
      }

      if (activeTool === 'pan' || (activeTool === 'select' && (e.button === 1 || e.spaceKey))) {
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
        return;
      }

      const coords = getCanvasCoords(e.clientX, e.clientY);
      drawStartX = coords.x;
      drawStartY = coords.y;

      if (activeTool.startsWith('draw_')) {
        isDrawing = true;
        previewBox.style.display = 'block';
        previewBox.style.left = `${drawStartX}px`;
        previewBox.style.top = `${drawStartY}px`;
        previewBox.style.width = '10px';
        previewBox.style.height = '10px';
        previewBox.style.borderRadius = (activeTool.includes('round') || activeTool === 'draw_stool') ? '9999px' : '6px';
      } else {
        selectedId = null;
        updateSelectedHighlight();
        updateInspector();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        applyTransform();
        return;
      }

      if (draggingObj && draggingEl) {
        const dx = (e.clientX - dragStartMouseX) / scale;
        const dy = (e.clientY - dragStartMouseY) / scale;

        draggingObj.x = Math.round((dragStartObjX + dx) / 5) * 5;
        draggingObj.y = Math.round((dragStartObjY + dy) / 5) * 5;

        draggingEl.style.left = `${draggingObj.x}px`;
        draggingEl.style.top = `${draggingObj.y}px`;
        return;
      }

      if (isDrawing) {
        const coords = getCanvasCoords(e.clientX, e.clientY);
        let left = Math.min(drawStartX, coords.x);
        let top = Math.min(drawStartY, coords.y);
        let width = Math.abs(coords.x - drawStartX);
        let height = Math.abs(coords.y - drawStartY);

        if (activeTool.includes('round') || activeTool === 'draw_stool') {
          const side = Math.max(width, height);
          width = side; height = side;
        }

        previewBox.style.left = `${left}px`;
        previewBox.style.top = `${top}px`;
        previewBox.style.width = `${Math.max(10, width)}px`;
        previewBox.style.height = `${Math.max(10, height)}px`;
      }
    });

    window.addEventListener('pointerup', () => {
      if (isPanning) {
        isPanning = false;
        viewport.style.cursor = activeTool === 'pan' ? 'grab' : 'default';
      }

      if (draggingObj) {
        draggingObj = null;
        draggingEl = null;
        triggerAutoSave();
        updateInspector();
      }

      if (!isDrawing) return;
      isDrawing = false;
      previewBox.style.display = 'none';

      let left = parseInt(previewBox.style.left, 10);
      let top = parseInt(previewBox.style.top, 10);
      let width = parseInt(previewBox.style.width, 10);
      let height = parseInt(previewBox.style.height, 10);

      // Для табуретки даже короткий одиночный клик создает аккуратный стульчик 32x32
      if (activeTool === 'draw_stool' && (width < 15 || height < 15)) {
        width = 32;
        height = 32;
      } else if (width < 10 && height < 10) {
        return;
      }

      createDrawnObject(activeTool, left, top, width, height);
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      window.adjustZoom(e.deltaY < 0 ? 0.08 : -0.08);
    }, { passive: false });

    function createDrawnObject(tool, x, y, w, h) {
      if (tool === 'draw_table_rect' || tool === 'draw_table_round') {
        const isRound = tool === 'draw_table_round';
        const nextNum = tables.length > 0 ? Math.max(...tables.map(t => parseInt(t.id) || 0)) + 1 : 1;
        const newTable = {
          id: nextNum,
          name: `${nextNum}`,
          type: 'table',
          shape: isRound ? 'round' : 'rect',
          x, y, w, h,
          rotation: 0,
          guests: 2,
          waiter: "",
          items: []
        };
        tables.push(newTable);
        selectedId = newTable.id;
      } else {
        const category = tool.replace('draw_', '');
        const isRound = category === 'column' || category === 'stool';
        const newObs = {
          id: `obs_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
          type: category,
          shape: isRound ? 'round' : 'rect',
          x, y, 
          w: category === 'stool' ? Math.min(45, Math.max(25, w)) : w,
          h: category === 'stool' ? Math.min(45, Math.max(25, h)) : h,
          rotation: 0
        };
        obstacles.push(newObs);
        selectedId = newObs.id;
      }

      renderElements();
      updateInspector();
      triggerAutoSave();
      window.setTool('select');
    }

    function renderElements() {
      elementsLayer.innerHTML = '';

      obstacles.forEach(obs => {
        const el = document.createElement('div');
        el.id = `item_${obs.id}`;
        el.className = `drawn-item ${selectedId === obs.id ? 'selected' : ''}`;
        el.style.left = `${obs.x}px`;
        el.style.top = `${obs.y}px`;
        el.style.width = `${obs.w}px`;
        el.style.height = `${obs.h}px`;
        el.style.transform = `rotate(${obs.rotation || 0}deg)`;

        if (obs.type === 'stool') {
          el.className += " stool-item";
          el.innerHTML = `<div class="stool-inner"></div>`;
        } else if (obs.type === 'sofa') {
          el.className += " sofa-item";
          el.innerHTML = `<div class="sofa-back-strip"></div>`;
        } else if (obs.type === 'plant') {
          el.className += " plant-divider";
        } else if (obs.type === 'window') {
          el.className += " window-glass";
        } else if (obs.type === 'wall') {
          el.className += " bg-stone-700 border border-stone-600 rounded-sm";
        } else if (obs.type === 'bar') {
          el.className += " bg-amber-950 border-2 border-amber-700 rounded-2xl";
        } else if (obs.type === 'column') {
          el.className += " bg-stone-500 border-2 border-stone-400 rounded-full";
        }

        bindDragToElement(el, obs);
        elementsLayer.appendChild(el);
      });

      tables.forEach(table => {
        const el = document.createElement('div');
        el.id = `item_${table.id}`;
        const isRound = table.shape === 'round';
        const shapeClass = isRound ? 'rounded-full' : 'rounded-2xl';

        el.className = `drawn-item bg-amber-500/15 hover:bg-amber-500/25 border-2 border-amber-500 text-amber-300 ${shapeClass} flex items-center justify-center font-black text-sm shadow-xl ${selectedId === table.id ? 'selected' : ''}`;
        el.style.left = `${table.x}px`;
        el.style.top = `${table.y}px`;
        el.style.width = `${table.w}px`;
        el.style.height = `${table.h}px`;
        el.style.transform = `rotate(${table.rotation || 0}deg)`;

        el.innerHTML = `<span>${table.name || table.id}</span>`;

        bindDragToElement(el, table);
        elementsLayer.appendChild(el);
      });
    }

    function bindDragToElement(el, itemData) {
      el.onpointerdown = (e) => {
        if (activeTool !== 'select') return;
        e.stopPropagation();

        selectedId = itemData.id;
        updateSelectedHighlight();
        updateInspector();

        draggingObj = itemData;
        draggingEl = el;
        dragStartMouseX = e.clientX;
        dragStartMouseY = e.clientY;
        dragStartObjX = itemData.x;
        dragStartObjY = itemData.y;

        try { el.setPointerCapture(e.pointerId); } catch(err) {}
      };

      el.onpointermove = (e) => {
        if (!draggingObj || draggingObj.id !== itemData.id) return;
        e.stopPropagation();

        const dx = (e.clientX - dragStartMouseX) / scale;
        const dy = (e.clientY - dragStartMouseY) / scale;

        itemData.x = Math.round((dragStartObjX + dx) / 5) * 5;
        itemData.y = Math.round((dragStartObjY + dy) / 5) * 5;

        el.style.left = `${itemData.x}px`;
        el.style.top = `${itemData.y}px`;
      };

      el.onpointerup = (e) => {
        if (draggingObj && draggingObj.id === itemData.id) {
          draggingObj = null;
          draggingEl = null;
          try { el.releasePointerCapture(e.pointerId); } catch(err) {}
          triggerAutoSave();
          updateInspector();
        }
      };

      el.onpointercancel = (e) => {
        if (draggingObj && draggingObj.id === itemData.id) {
          draggingObj = null;
          draggingEl = null;
          try { el.releasePointerCapture(e.pointerId); } catch(err) {}
        }
      };
    }

    function updateSelectedHighlight() {
      document.querySelectorAll('.drawn-item').forEach(el => {
        el.classList.remove('selected');
      });
      if (selectedId) {
        const active = document.getElementById(`item_${selectedId}`);
        if (active) active.classList.add('selected');
      }
    }

    function updateInspector() {
      const emptyBox = document.getElementById('inspEmpty');
      const form = document.getElementById('inspForm');
      const delBox = document.getElementById('inspDeleteBox');
      const typeBadge = document.getElementById('inspTypeBadge');
      const nameField = document.getElementById('tableNameField');

      const obj = tables.find(t => t.id === selectedId) || obstacles.find(o => o.id === selectedId);

      if (!obj) {
        emptyBox.classList.remove('hidden');
        form.classList.add('hidden');
        delBox.classList.add('hidden');
        typeBadge.textContent = '—';
        return;
      }

      emptyBox.classList.add('hidden');
      form.classList.remove('hidden');
      delBox.classList.remove('hidden');

      const isTable = obj.type === 'table';
      typeBadge.textContent = (obj.type || 'СТОЛ').toUpperCase();

      if (isTable) {
        nameField.classList.remove('hidden');
        document.getElementById('inspName').value = obj.name || obj.id;
      } else {
        nameField.classList.add('hidden');
      }

      document.getElementById('inspW').value = obj.w;
      document.getElementById('inspH').value = obj.h;

      const angle = obj.rotation || 0;
      document.getElementById('inspRotationSlider').value = angle;
      document.getElementById('inspAngleVal').textContent = `${angle}°`;
    }

    window.editProp = (prop, val) => {
      const obj = tables.find(t => t.id === selectedId) || obstacles.find(o => o.id === selectedId);
      if (!obj) return;

      if (prop === 'name') {
        obj.name = val;
      } else if (prop === 'w') {
        obj.w = Math.max(10, val || 10);
        if (obj.shape === 'round') obj.h = obj.w;
      } else if (prop === 'h') {
        obj.h = Math.max(10, val || 10);
        if (obj.shape === 'round') obj.w = obj.h;
      }

      const el = document.getElementById(`item_${selectedId}`);
      if (el) {
        el.style.width = `${obj.w}px`;
        el.style.height = `${obj.h}px`;
        if (obj.type === 'table') {
          el.innerHTML = `<span>${obj.name || obj.id}</span>`;
        }
      }
      triggerAutoSave();
    };

    window.editRotation = (deg) => {
      const obj = tables.find(t => t.id === selectedId) || obstacles.find(o => o.id === selectedId);
      if (!obj) return;
      obj.rotation = deg;
      document.getElementById('inspAngleVal').textContent = `${deg}°`;
      
      const el = document.getElementById(`item_${selectedId}`);
      if (el) el.style.transform = `rotate(${deg}deg)`;
      triggerAutoSave();
    };

    window.addRotation = (delta) => {
      const obj = tables.find(t => t.id === selectedId) || obstacles.find(o => o.id === selectedId);
      if (!obj) return;
      let angle = (obj.rotation || 0) + delta;
      if (angle >= 360) angle -= 360;
      if (angle < 0) angle += 360;
      obj.rotation = angle;
      document.getElementById('inspRotationSlider').value = angle;
      document.getElementById('inspAngleVal').textContent = `${angle}°`;
      
      const el = document.getElementById(`item_${selectedId}`);
      if (el) el.style.transform = `rotate(${angle}deg)`;
      triggerAutoSave();
    };

    window.deleteActiveObject = () => {
      tables = tables.filter(t => t.id !== selectedId);
      obstacles = obstacles.filter(o => o.id !== selectedId);
      selectedId = null;
      renderElements();
      updateInspector();
      triggerAutoSave();
    };

    window.clearEverything = () => {
      if (!confirm('Очистить всю карту?')) return;
      tables = [];
      obstacles = [];
      selectedId = null;
      renderElements();
      updateInspector();
      triggerAutoSave();
    };

    window.downloadBackupJSON = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ tables, obstacles }, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `coffeeman_hall_plan_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.importBackupJSON = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && (parsed.tables || parsed.obstacles)) {
            tables = parsed.tables || [];
            obstacles = parsed.obstacles || [];
            renderElements();
            triggerAutoSave();
            alert("План успешно загружен из файла!");
          }
        } catch (err) {
          alert("Ошибка чтения файла: неверный формат JSON");
        }
      };
      reader.readAsText(file);
    };

    window.saveFloorplan = () => {
      const cleanTables = tables.map(t => ({
        id: Number(t.id) || 1,
        name: String(t.name || t.id),
        type: "table",
        shape: t.shape || "round",
        x: Number(t.x) || 0,
        y: Number(t.y) || 0,
        w: Number(t.w) || 80,
        h: Number(t.h) || 80,
        rotation: Number(t.rotation) || 0,
        guests: Number(t.guests) || 2,
        waiter: t.waiter || "",
        items: Array.isArray(t.items) ? t.items : []
      }));

      const cleanObstacles = obstacles.map(o => ({
        id: String(o.id),
        type: o.type || "wall",
        shape: o.shape || "rect",
        x: Number(o.x) || 0,
        y: Number(o.y) || 0,
        w: Number(o.w) || 80,
        h: Number(o.h) || 80,
        rotation: Number(o.rotation) || 0
      }));

      triggerAutoSave();
      saveTablesToCloud(cleanTables, cleanObstacles, "Конструктор");
      alert("Карта зала сохранена локально и отправлена в облако Firebase!");
    };

    try {
      const localData = localStorage.getItem('coffeeman_local_backup');
      if (localData) {
        const parsed = JSON.parse(localData);
        if (parsed.tables && parsed.tables.length > 0) tables = parsed.tables;
        if (parsed.obstacles && parsed.obstacles.length > 0) obstacles = parsed.obstacles;
        renderElements();
      }
    } catch(e) {}

    let isInitialLoaded = false;

    initFirebaseAuth(() => {
      subscribeToCloudTables((remoteTables, remoteObstacles) => {
        if (!isInitialLoaded) {
          isInitialLoaded = true;

          if (remoteTables && remoteTables.length > 0) {
            tables = remoteTables.map(t => ({
              ...t,
              w: Number(t.w) || 80,
              h: Number(t.h) || 80,
              rotation: Number(t.rotation) || 0,
              x: Number(t.x) || 100,
              y: Number(t.y) || 100
            }));
          }

          if (remoteObstacles && remoteObstacles.length > 0) {
            obstacles = remoteObstacles.map(o => ({
              ...o,
              w: Number(o.w) || 80,
              h: Number(o.h) || 80,
              rotation: Number(o.rotation) || 0,
              x: Number(o.x) || 100,
              y: Number(o.y) || 100
            }));
          }

          renderElements();
          applyTransform();
        }
      });
    });
  </script>
</body>
