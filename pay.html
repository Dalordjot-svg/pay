<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Moon POS • СБП Оплата</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Syne:wght@700;800;900&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
  
  <!-- Надежная легковесная библиотека QR-кода -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Unbounded', 'sans-serif'],
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: { sticker: '#FFF188', surface: '#18181d', surfaceLight: '#23232b' }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background: #0d0d10; color: white; }
    .sticker-badge { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .stamp-badge {
      clip-path: polygon(50% 0%, 65% 15%, 85% 10%, 85% 30%, 100% 45%, 90% 65%, 95% 85%, 75% 85%, 65% 100%, 45% 90%, 25% 95%, 20% 75%, 0% 65%, 12% 45%, 5% 25%, 25% 20%, 35% 0%);
    }
    #qrcode-box img, #qrcode-box canvas {
      margin: 0 auto;
      border-radius: 1rem;
    }
  </style>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8CBeK8m25rox6BYO8ep6JeBJ7ipmYViQ",
      authDomain: "moon-60c5a.firebaseapp.com",
      databaseURL: "https://moon-60c5a-default-rtdb.firebaseio.com",
      projectId: "moon-60c5a",
      storageBucket: "moon-60c5a.firebasestorage.app",
      messagingSenderId: "1010513396599",
      appId: "1:1010513396599:web:86cbb8164de80b1dcc9772"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.firebaseDB = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbGet = get;
    window.dbUpdate = update;

    window.yooKassaConfig = {
      shopId: localStorage.getItem('yk_shop_id') || '',
      secretKey: localStorage.getItem('yk_secret_key') || 'live_u1nG8LW2Njov2qtlvYjkb2ulHYgVAjVs4h8wryP1bcA',
      serverUrl: localStorage.getItem('yk_server_url') || 'https://green-glade-501c.dalordjot.workers.dev'
    };

    onValue(ref(db, 'admin_settings/yookassa'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.shopId && !localStorage.getItem('yk_shop_id')) window.yooKassaConfig.shopId = data.shopId;
        if (data.secretKey && !localStorage.getItem('yk_secret_key')) window.yooKassaConfig.secretKey = data.secretKey;
        if (data.serverUrl && !localStorage.getItem('yk_server_url')) window.yooKassaConfig.serverUrl = data.serverUrl;
        updateKeyStatusBadge();
      }
    });
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- TOP BAR -->
  <header class="w-full bg-surface/90 backdrop-blur-xl border-b border-white/10 px-4 md:px-8 py-3 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-2.5">
      <div class="stamp-badge bg-sticker text-black font-display font-black text-xs px-2.5 py-1 uppercase -rotate-3 shadow-md">
        MOON
      </div>
      <h1 class="font-display text-xs md:text-sm font-black tracking-wide uppercase">Касса СБП</h1>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openKeysModal(false)" class="flex items-center gap-1.5 bg-surfaceLight hover:bg-white/15 active:scale-95 text-xs text-white border border-white/10 px-3 py-2 rounded-xl font-display font-bold transition-all">
        <span>⚙️</span>
        <span class="hidden sm:inline">Ключи ЮKassa</span>
        <span id="keys-status-indicator" class="w-2 h-2 rounded-full bg-rose-500 ml-0.5"></span>
      </button>

      <a href="https://dalordjot-svg.github.io/Do-go/" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 bg-yellow-400/10 hover:bg-yellow-400/20 active:scale-95 text-xs text-sticker border border-yellow-400/30 px-3 py-2 rounded-xl font-display font-bold transition-all shadow-sm">
        <span>🖥️</span>
        <span class="hidden sm:inline">Экран покупателя</span>
        <span class="sm:hidden">Экран</span>
        <span class="text-[10px] opacity-75">↗</span>
      </a>
    </div>
  </header>

  <!-- МОДАЛКА НАСТРОЕК -->
  <div id="keys-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-surface border border-white/15 rounded-3xl p-6 shadow-2xl flex flex-col gap-4 text-left">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <div>
          <h3 class="font-display font-black text-sm uppercase text-sticker">Настройки ЮKassa</h3>
          <p class="text-[11px] text-neutral-400">Shop ID и Секретный ключ</p>
        </div>
        <button id="modal-close-btn" onclick="closeKeysModal()" class="text-neutral-400 hover:text-white text-lg p-1">✕</button>
      </div>

      <div class="flex flex-col gap-3">
        <div>
          <label class="text-[11px] text-neutral-300 font-bold uppercase block mb-1">Сервер посредник</label>
          <input type="text" id="modal-server-url" value="https://green-glade-501c.dalordjot.workers.dev" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-yellow-300" />
        </div>
        <div>
          <label class="text-[11px] text-neutral-300 font-bold uppercase block mb-1">Shop ID (номер из шапки ЛК)</label>
          <input type="text" id="modal-shop-id" placeholder="Вставьте точный Shop ID" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-yellow-300" />
        </div>
        <div>
          <label class="text-[11px] text-neutral-300 font-bold uppercase block mb-1">Секретный ключ API</label>
          <input type="text" id="modal-secret-key" value="live_u1nG8LW2Njov2qtlvYjkb2ulHYgVAjVs4h8wryP1bcA" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-yellow-300" />
        </div>
      </div>

      <div class="flex flex-col gap-2 pt-2">
        <button onclick="saveKeysFromModal()" class="w-full bg-sticker text-black font-display font-black text-xs uppercase py-3.5 rounded-xl active:scale-95 transition-all sticker-badge">
          Сохранить настройки
        </button>
        <button onclick="clearStoredKeys()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-[11px] font-bold py-2 rounded-xl border border-rose-500/20">
          Сбросить все сохранённые ключи
        </button>
      </div>
    </div>
  </div>

  <!-- ГЛАВНЫЙ ЭКРАН КАССЫ -->
  <main class="flex-1 p-4 md:p-8 flex items-center justify-center">
    <div class="w-full max-w-md bg-surface border border-white/10 rounded-3xl p-6 md:p-8 flex flex-col gap-5 shadow-2xl">
      
      <!-- Экран суммы -->
      <div class="bg-black/50 border border-white/10 rounded-3xl p-6 text-center">
        <span class="text-xs text-neutral-400 uppercase font-bold tracking-widest block mb-2">Сумма к оплате (СБП)</span>
        <div class="flex items-center justify-center gap-2">
          <span id="amount-display" class="font-display text-5xl md:text-6xl font-black tracking-tight">0</span>
          <span class="font-display text-3xl md:text-4xl font-bold text-sticker">₽</span>
        </div>
        <p id="pos-status-text" class="text-xs text-neutral-400 mt-2 break-words">Готов к выставлению СБП QR</p>
      </div>

      <!-- Ввод суммы (Numpad) -->
      <div id="keypad-container" class="flex flex-col gap-5">
        <div class="grid grid-cols-3 gap-3">
          <button onclick="pressKey('1')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">1</button>
          <button onclick="pressKey('2')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">2</button>
          <button onclick="pressKey('3')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">3</button>
          <button onclick="pressKey('4')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">4</button>
          <button onclick="pressKey('5')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">5</button>
          <button onclick="pressKey('6')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">6</button>
          <button onclick="pressKey('7')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">7</button>
          <button onclick="pressKey('8')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">8</button>
          <button onclick="pressKey('9')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">9</button>
          <button onclick="pressKey('00')" class="h-14 md:h-16 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 border border-white/10 font-display text-xl font-black text-neutral-400">00</button>
          <button onclick="pressKey('0')" class="h-14 md:h-16 rounded-2xl bg-surfaceLight hover:bg-white/15 active:scale-95 border border-white/10 font-display text-2xl font-black">0</button>
          <button onclick="backspace()" class="h-14 md:h-16 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 active:scale-95 border border-rose-500/30 text-rose-300 font-bold text-xl">⌫</button>
        </div>

        <button id="send-bill-btn" onclick="createDirectSbpPayment()" class="w-full bg-sticker text-black font-display font-black text-base uppercase py-4 rounded-2xl active:scale-[0.98] transition-transform sticker-badge">
          ⚡ Выставить СБП QR
        </button>
      </div>

      <!-- Экран с QR кодом -->
      <div id="qr-container" class="hidden flex-col items-center gap-4">
        <div class="relative bg-white p-4 rounded-3xl shadow-2xl flex items-center justify-center min-w-[240px] min-h-[240px]">
          <!-- Контейнер для QR -->
          <div id="qrcode-box"></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-10 h-10 bg-black rounded-xl border-2 border-white flex items-center justify-center text-xs font-bold text-sticker">
              СБП
            </div>
          </div>
        </div>

        <div class="text-center">
          <p class="text-xs text-neutral-300 font-semibold flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
            Отсканируйте камерой телефона или банком
          </p>
          <a id="qr-direct-link" href="#" target="_blank" class="text-[11px] text-sticker hover:underline mt-1 inline-block">
            Открыть ссылку на оплату вручную →
          </a>
        </div>

        <button onclick="resetTerminal()" class="w-full bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-display font-bold text-xs uppercase py-3.5 rounded-2xl border border-rose-500/30 transition-all">
          ✕ Отменить / Новый счет
        </button>
      </div>

    </div>
  </main>

  <script>
    let currentInput = "0";
    let activePollInterval = null;
    const terminalId = localStorage.getItem('yk_term_id') || 'term_01';

    function updateKeyStatusBadge() {
      const sId = localStorage.getItem('yk_shop_id') || (window.yooKassaConfig && window.yooKassaConfig.shopId);
      const sKey = localStorage.getItem('yk_secret_key') || (window.yooKassaConfig && window.yooKassaConfig.secretKey);
      const indicator = document.getElementById('keys-status-indicator');
      if (indicator) {
        if (sId && sKey) {
          indicator.className = 'w-2 h-2 rounded-full bg-emerald-400 ml-0.5';
        } else {
          indicator.className = 'w-2 h-2 rounded-full bg-rose-500 ml-0.5';
          openKeysModal(true);
        }
      }
    }

    function openKeysModal(isMandatory = false) {
      document.getElementById('modal-server-url').value = localStorage.getItem('yk_server_url') || window.yooKassaConfig.serverUrl;
      document.getElementById('modal-shop-id').value = localStorage.getItem('yk_shop_id') || window.yooKassaConfig.shopId;
      document.getElementById('modal-secret-key').value = localStorage.getItem('yk_secret_key') || window.yooKassaConfig.secretKey;
      
      const closeBtn = document.getElementById('modal-close-btn');
      if (isMandatory) closeBtn.classList.add('hidden');
      else closeBtn.classList.remove('hidden');

      document.getElementById('keys-modal').classList.remove('hidden');
    }

    function closeKeysModal() {
      document.getElementById('keys-modal').classList.add('hidden');
    }

    function clearStoredKeys() {
      localStorage.removeItem('yk_shop_id');
      localStorage.removeItem('yk_secret_key');
      localStorage.removeItem('yk_server_url');
      location.reload();
    }

    function saveKeysFromModal() {
      let serverUrl = document.getElementById('modal-server-url').value.trim();
      const sId = document.getElementById('modal-shop-id').value.trim();
      const sKey = document.getElementById('modal-secret-key').value.trim();

      if (serverUrl.endsWith('/')) serverUrl = serverUrl.slice(0, -1);

      if (!sId || !sKey) {
        alert('Пожалуйста, введите точный Shop ID и Секретный ключ!');
        return;
      }

      localStorage.setItem('yk_server_url', serverUrl);
      localStorage.setItem('yk_shop_id', sId);
      localStorage.setItem('yk_secret_key', sKey);

      window.yooKassaConfig.serverUrl = serverUrl;
      window.yooKassaConfig.shopId = sId;
      window.yooKassaConfig.secretKey = sKey;

      updateKeyStatusBadge();
      closeKeysModal();
      document.getElementById('pos-status-text').innerText = 'Ключи успешно обновлены!';
    }

    window.addEventListener('DOMContentLoaded', updateKeyStatusBadge);

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function updateDisplay() {
      document.getElementById('amount-display').innerText = currentInput;
    }

    function pressKey(num) {
      if (currentInput === "0") {
        if (num === "00") return;
        currentInput = num;
      } else {
        if (currentInput.length < 7) currentInput += num;
      }
      updateDisplay();
    }

    function backspace() {
      currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
      updateDisplay();
    }

    // Безопасный рендер QR-кода с fallback-вариантом
    function renderQRCodeSafe(text) {
      const box = document.getElementById('qrcode-box');
      box.innerHTML = '';

      if (typeof QRCode !== 'undefined') {
        new QRCode(box, {
          text: text,
          width: 210,
          height: 210,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        // Запасной генератор, если скрипт заблокирован в сети
        const img = document.createElement('img');
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=210x210&data=${encodeURIComponent(text)}`;
        img.className = 'w-[210px] h-[210px] rounded-2xl';
        box.appendChild(img);
      }
    }

    async function createDirectSbpPayment() {
      const amount = parseInt(currentInput);
      if (!amount || amount <= 0) return alert('Введите сумму больше 0');

      let serverUrl = localStorage.getItem('yk_server_url') || window.yooKassaConfig.serverUrl;
      const shopId = (localStorage.getItem('yk_shop_id') || window.yooKassaConfig.shopId || '').trim();
      const secretKey = (localStorage.getItem('yk_secret_key') || window.yooKassaConfig.secretKey || '').trim();

      if (serverUrl.endsWith('/')) serverUrl = serverUrl.slice(0, -1);

      if (!shopId || !secretKey) {
        openKeysModal(true);
        return;
      }

      const btn = document.getElementById('send-bill-btn');
      const status = document.getElementById('pos-status-text');
      btn.disabled = true;
      btn.innerText = '⏳ Создаем СБП QR...';
      status.innerText = 'Связываемся с ЮKassa...';

      if (activePollInterval) clearInterval(activePollInterval);

      const authHeader = 'Basic ' + btoa(`${shopId}:${secretKey}`);
      const idempotenceKey = generateUUID();

      try {
        const response = await fetch(`${serverUrl}/payments`, {
          method: 'POST',
          headers: {
            'Authorization': authHeader,
            'Idempotence-Key': idempotenceKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            amount: { value: amount.toFixed(2), currency: 'RUB' },
            payment_method_data: { type: 'sbp' },
            confirmation: { type: 'qr' },
            capture: true,
            description: `Заказ на кассе (${amount} ₽)`
          })
        });

        const payment = await response.json();

        if (!response.ok || !payment.id) {
          throw new Error(payment.description || payment.code || 'Ошибка создания платежа');
        }

        const sbpQrData = payment.confirmation?.confirmation_data || payment.confirmation?.confirmation_url || '';

        // Отрисовка QR
        renderQRCodeSafe(sbpQrData);
        document.getElementById('qr-direct-link').href = sbpQrData;

        // Показ QR, скрытие кнопок
        document.getElementById('keypad-container').classList.add('hidden');
        document.getElementById('qr-container').classList.remove('hidden');
        document.getElementById('qr-container').classList.add('flex');

        if (window.firebaseDB) {
          await window.dbSet(window.dbRef(window.firebaseDB, `terminals/${terminalId}/current_order`), {
            status: 'WAITING_FOR_PAYMENT',
            method: 'sbp',
            amount: amount,
            paymentId: payment.id,
            qrUrl: sbpQrData,
            timestamp: Date.now()
          });
        }

        status.innerHTML = `<span class="text-sticker font-bold">Счет выставлен! Ожидание оплаты...</span>`;
        startDirectPaymentPolling(serverUrl, authHeader, payment.id, amount);

      } catch (err) {
        status.innerHTML = `<span class="text-rose-400 font-bold">Ошибка: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerText = '⚡ Выставить СБП QR';
      }
    }

    function startDirectPaymentPolling(serverUrl, authHeader, paymentId, amount) {
      activePollInterval = setInterval(async () => {
        try {
          const res = await fetch(`${serverUrl}/payments/${paymentId}`, {
            method: 'GET',
            headers: {
              'Authorization': authHeader,
              'Content-Type': 'application/json'
            }
          });

          const data = await res.json();

          if (data && (data.status === 'succeeded' || data.paid === true)) {
            clearInterval(activePollInterval);
            
            if (window.firebaseDB) {
              await window.dbSet(window.dbRef(window.firebaseDB, `terminals/${terminalId}/current_order`), {
                status: 'PAID', amount: amount, timestamp: Date.now()
              });
            }

            document.getElementById('qr-container').classList.add('hidden');
            document.getElementById('qr-container').classList.remove('flex');
            document.getElementById('keypad-container').classList.remove('hidden');

            currentInput = "0";
            updateDisplay();
            document.getElementById('pos-status-text').innerHTML = '<span class="text-emerald-400 font-bold text-sm">✅ Оплата прошла успешно!</span>';
          }
        } catch (e) { console.error("Polling error:", e); }
      }, 2000);
    }

    async function resetTerminal() {
      if (activePollInterval) clearInterval(activePollInterval);
      if (window.firebaseDB) {
        await window.dbSet(window.dbRef(window.firebaseDB, `terminals/${terminalId}/current_order`), { status: 'IDLE' });
      }

      document.getElementById('qr-container').classList.add('hidden');
      document.getElementById('qr-container').classList.remove('flex');
      document.getElementById('keypad-container').classList.remove('hidden');

      currentInput = "0";
      updateDisplay();
      document.getElementById('pos-status-text').innerText = 'Готов к выставлению СБП QR';
    }

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (e.key >= '0' && e.key <= '9') pressKey(e.key);
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Enter') createDirectSbpPayment();
      else if (e.key === 'Escape') resetTerminal();
    });
  </script>
</body>
</html>
