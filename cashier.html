<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>СБП Касса — Терминал</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-800 flex flex-col items-center justify-center min-h-screen p-4 font-sans select-none overflow-hidden antialiased">

  <main class="w-full max-w-sm bg-white/95 backdrop-blur-xl rounded-[36px] border border-white/60 shadow-2xl p-6 relative overflow-hidden flex flex-col justify-between min-h-[660px]">
    
    <!-- Шапка -->
    <header class="flex items-center justify-between pb-3.5 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md">
          <i data-lucide="calculator" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="font-extrabold text-sm text-slate-900 block leading-tight">СБП Касса</span>
          <span class="text-[10px] font-bold text-blue-600 tracking-wider uppercase block">Терминал кассира</span>
        </div>
      </div>

      <button id="openSettingsBtn" class="p-2.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-slate-600 transition active:scale-95 border border-slate-100">
        <i data-lucide="sliders" class="w-4 h-4"></i>
      </button>
    </header>

    <!-- Экран 1: Ввод суммы -->
    <section id="inputScreen" class="flex flex-col flex-1 justify-between pt-4">
      <div class="text-center my-auto bg-gradient-to-b from-blue-50/80 to-slate-50 p-5 rounded-3xl border border-blue-100/70 shadow-inner">
        <span class="text-[11px] uppercase tracking-widest text-slate-400 font-bold">Сумма к оплате</span>
        <div class="flex items-baseline justify-center gap-1.5 mt-1.5">
          <span id="amountDisplay" class="text-4xl font-black tracking-tight text-slate-900">0</span>
          <span class="text-2xl font-extrabold text-blue-600">₽</span>
        </div>
      </div>

      <!-- Клавиатура -->
      <div class="grid grid-cols-3 gap-2.5 my-4">
        <button onclick="pressKey('1')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">1</button>
        <button onclick="pressKey('2')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">2</button>
        <button onclick="pressKey('3')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">3</button>
        <button onclick="pressKey('4')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">4</button>
        <button onclick="pressKey('5')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">5</button>
        <button onclick="pressKey('6')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">6</button>
        <button onclick="pressKey('7')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">7</button>
        <button onclick="pressKey('8')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">8</button>
        <button onclick="pressKey('9')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">9</button>
        <button onclick="pressKey('C')" class="h-13 py-3.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-500 font-bold transition active:scale-95 border border-rose-100">C</button>
        <button onclick="pressKey('0')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-800 transition active:scale-95 border border-slate-100">0</button>
        <button onclick="pressKey('backspace')" class="h-13 py-3.5 rounded-2xl bg-slate-50 hover:bg-blue-50 flex items-center justify-center text-slate-600 transition active:scale-95 border border-slate-100">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
      </div>

      <button id="generateBtn" onclick="createPaymentQR()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 text-white font-extrabold text-base shadow-lg shadow-blue-500/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <span id="btnText">Выставить счёт на экран</span>
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </button>
    </section>

    <!-- Экран 2: QR на терминале -->
    <section id="qrScreen" class="hidden flex flex-col flex-1 justify-between items-center pt-2">
      <div class="w-full bg-slate-50/90 rounded-3xl p-4 border border-slate-200/80 shadow-sm flex flex-col items-center my-auto">
        <h2 class="text-base font-black text-slate-900">QR отправлен на экран</h2>
        <div class="p-2.5 bg-white rounded-2xl border border-slate-200 shadow-sm my-3">
          <div id="qrcode"></div>
        </div>
        <div class="text-2xl font-black text-slate-900 mb-2">
          <span id="qrAmount">0</span> ₽
        </div>
        <div class="w-full bg-white rounded-xl p-2 border border-slate-200/70 flex items-center justify-between text-xs">
          <span class="text-slate-600 font-semibold flex items-center gap-1.5"><i data-lucide="timer" class="w-3.5 h-3.5 text-blue-600"></i>Таймер:</span>
          <span id="timerDisplay" class="font-extrabold text-blue-600 font-mono">05:00</span>
        </div>
      </div>
      <button onclick="cancelPayment()" class="w-full mt-3 py-3.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-sm border border-rose-100 transition active:scale-[0.98]">
        Отменить оплату
      </button>
    </section>

    <!-- Экран 3: Успех -->
    <section id="successScreen" class="hidden flex flex-col flex-1 justify-between items-center pt-4">
      <div class="w-full flex flex-col items-center my-auto">
        <div class="w-16 h-16 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center shadow-lg shadow-emerald-500/20 mb-3 animate-bounce">
          <i data-lucide="check" class="w-8 h-8 text-emerald-600"></i>
        </div>
        <h2 class="text-xl font-black text-slate-900">Оплачено!</h2>
        <div class="w-full bg-slate-50 rounded-2xl p-4 border border-slate-200/80 shadow-sm mt-4 space-y-2 text-xs">
          <div class="flex justify-between text-slate-500 font-medium">
            <span>Сумма</span>
            <span class="font-extrabold text-slate-900 text-sm"><span id="receiptAmount">0</span> ₽</span>
          </div>
          <div class="flex justify-between text-slate-500 font-medium">
            <span>ID</span>
            <span id="receiptId" class="font-mono text-[10px] text-slate-400">#---</span>
          </div>
        </div>
      </div>
      <button onclick="newPayment()" class="w-full mt-4 py-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm shadow-lg transition active:scale-[0.98]">
        Новый платёж
      </button>
    </section>

    <!-- Настройки -->
    <div id="settingsModal" class="hidden absolute inset-0 bg-white/95 backdrop-blur-md p-6 flex flex-col justify-between z-50 overflow-y-auto">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h2 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-blue-600"></i>
            Настройки
          </h2>
          <button id="closeSettingsBtn" class="p-1 text-slate-400 hover:text-slate-700">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="space-y-3.5 mt-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Shop ID</label>
            <input id="shopIdInput" type="text" placeholder="1350725" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Секретный ключ (API Key)</label>
            <input id="secretKeyInput" type="password" placeholder="live_..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Firebase Realtime DB URL</label>
            <input id="firebaseUrlInput" type="text" placeholder="https://ваш-проект-default-rtdb.firebaseio.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm" />
          </div>
        </div>
      </div>

      <button onclick="saveSettings()" class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-md transition active:scale-[0.98]">
        Сохранить настройки
      </button>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const WORKER_URL = 'https://green-glade-501c.dalordjot.workers.dev';

    let currentAmount = '0';
    let checkInterval = null;
    let timerInterval = null;
    let timeLeft = 300;

    const amountDisplay = document.getElementById('amountDisplay');
    const inputScreen = document.getElementById('inputScreen');
    const qrScreen = document.getElementById('qrScreen');
    const successScreen = document.getElementById('successScreen');
    const qrAmount = document.getElementById('qrAmount');
    const timerDisplay = document.getElementById('timerDisplay');
    const settingsModal = document.getElementById('settingsModal');
    const shopIdInput = document.getElementById('shopIdInput');
    const secretKeyInput = document.getElementById('secretKeyInput');
    const firebaseUrlInput = document.getElementById('firebaseUrlInput');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');

    window.addEventListener('DOMContentLoaded', () => {
      shopIdInput.value = localStorage.getItem('yk_shop_id') || '';
      secretKeyInput.value = localStorage.getItem('yk_secret_key') || '';
      firebaseUrlInput.value = localStorage.getItem('yk_firebase_url') || '';
    });

    function pressKey(key) {
      if (key === 'C') currentAmount = '0';
      else if (key === 'backspace') currentAmount = currentAmount.length > 1 ? currentAmount.slice(0, -1) : '0';
      else {
        if (currentAmount === '0') currentAmount = key;
        else if (currentAmount.length < 7) currentAmount += key;
      }
      amountDisplay.textContent = Number(currentAmount).toLocaleString('ru-RU');
    }

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    async function syncToFirebase(stateData) {
      const fbUrl = (localStorage.getItem('yk_firebase_url') || firebaseUrlInput.value.trim()).replace(/\/+$/, '');
      if (!fbUrl) return;
      try {
        await fetch(`${fbUrl}/pos_display.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(stateData)
        });
      } catch (err) {
        console.error('Firebase sync error:', err);
      }
    }

    function startTimer() {
      timeLeft = 300;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        timerDisplay.textContent = `${m}:${s}`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          cancelPayment();
        }
      }, 1000);
    }

    async function createPaymentQR() {
      const amount = parseInt(currentAmount, 10);
      if (isNaN(amount) || amount <= 0) return alert('Введите сумму');

      const shopId = localStorage.getItem('yk_shop_id') || shopIdInput.value.trim();
      const secretKey = localStorage.getItem('yk_secret_key') || secretKeyInput.value.trim();

      if (!shopId || !secretKey) {
        settingsModal.classList.remove('hidden');
        return alert('Заполните настройки!');
      }

      generateBtn.disabled = true;
      btnText.innerText = 'Создание...';

      const auth = btoa(`${shopId}:${secretKey}`);
      const idempotenceKey = generateUUID();

      try {
        const response = await fetch(`${WORKER_URL}/payments`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Basic ${auth}`,
            'Idempotence-Key': idempotenceKey
          },
          body: JSON.stringify({
            amount: { value: Number(amount).toFixed(2), currency: 'RUB' },
            payment_method_data: { type: 'sbp' },
            confirmation: { type: 'qr' },
            capture: true,
            description: `СБП: ${amount} руб.`
          })
        });

        const data = await response.json();
        if (!response.ok) return alert('Ошибка ЮKassa: ' + (data.description || data.error));

        const sbpUrl = data.confirmation?.confirmation_data;
        if (!sbpUrl) return alert('ЮKassa не вернула QR.');

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, { text: sbpUrl, width: 170, height: 170 });

        qrAmount.textContent = Number(currentAmount).toLocaleString('ru-RU');
        inputScreen.classList.add('hidden');
        qrScreen.classList.remove('hidden');

        // Отправляем QR на экран покупателя через Firebase
        syncToFirebase({
          status: 'pending',
          amount: amount,
          qr_url: sbpUrl,
          payment_id: data.id,
          timestamp: Date.now()
        });

        startTimer();
        startPolling(data.id, auth, amount);

      } catch (err) {
        alert('Ошибка: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'Выставить счёт на экран';
      }
    }

    function startPolling(paymentId, auth, amount) {
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(async () => {
        try {
          const res = await fetch(`${WORKER_URL}/payments/${paymentId}`, {
            headers: { 'Authorization': `Basic ${auth}` }
          });
          const data = await res.json();
          if (data.status === 'succeeded') {
            clearInterval(checkInterval);
            clearInterval(timerInterval);
            showSuccess(data.id, amount);
          } else if (data.status === 'canceled') {
            clearInterval(checkInterval);
            cancelPayment();
          }
        } catch (e) { console.error(e); }
      }, 2500);
    }

    function showSuccess(paymentId, amount) {
      qrScreen.classList.add('hidden');
      successScreen.classList.remove('hidden');
      document.getElementById('receiptAmount').textContent = Number(amount).toLocaleString('ru-RU');
      document.getElementById('receiptId').textContent = paymentId.slice(0, 16) + '...';

      // Оповещаем экран покупателя об успехе
      syncToFirebase({
        status: 'succeeded',
        amount: amount,
        payment_id: paymentId,
        timestamp: Date.now()
      });

      confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
    }

    function cancelPayment() {
      if (checkInterval) clearInterval(checkInterval);
      if (timerInterval) clearInterval(timerInterval);
      syncToFirebase({ status: 'idle', amount: 0, timestamp: Date.now() });
      qrScreen.classList.add('hidden');
      inputScreen.classList.remove('hidden');
      currentAmount = '0';
      amountDisplay.textContent = '0';
    }

    function newPayment() {
      successScreen.classList.add('hidden');
      inputScreen.classList.remove('hidden');
      currentAmount = '0';
      amountDisplay.textContent = '0';
      syncToFirebase({ status: 'idle', amount: 0, timestamp: Date.now() });
    }

    document.getElementById('openSettingsBtn').addEventListener('click', () => settingsModal.classList.remove('hidden'));
    document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.add('hidden'));

    function saveSettings() {
      localStorage.setItem('yk_shop_id', shopIdInput.value.trim());
      localStorage.setItem('yk_secret_key', secretKeyInput.value.trim());
      localStorage.setItem('yk_firebase_url', firebaseUrlInput.value.trim());
      settingsModal.classList.add('hidden');
      alert('Настройки сохранены!');
    }
  </script>
</body>
</html>
