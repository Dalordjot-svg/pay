<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COFFEEMAN • Экран кассира</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-100 text-stone-900 flex flex-col h-[100dvh] overflow-hidden select-none">

  <!-- Header -->
  <header class="bg-stone-900 text-white px-4 py-3 shrink-0 flex items-center justify-between border-b border-stone-800 shadow-md">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl bg-amber-500 text-amber-950 font-black flex items-center justify-center text-lg active:scale-95 transition">
        ☕
      </a>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-sm sm:text-base tracking-wide">COFFEEMAN</h1>
          <span class="text-[10px] bg-emerald-700 text-emerald-100 px-1.5 py-0.5 rounded font-bold">КАССА</span>
        </div>
        <p class="text-[11px] text-stone-400 leading-none">Терминал расчёта столов</p>
      </div>
    </div>

    <!-- Status & Links -->
    <div class="flex items-center gap-2 sm:gap-3 text-xs font-bold">
      <div class="flex items-center gap-1.5 bg-stone-800 px-2.5 py-1.5 rounded-xl border border-stone-700">
        <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="syncText" class="font-mono text-stone-300">В сети</span>
      </div>
      <a href="waiter.html" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-xl transition">
        Зал официанта →
      </a>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 p-3 min-h-0 overflow-hidden">
    
    <!-- LEFT: 11 Tables Grid -->
    <section class="lg:col-span-7 flex flex-col bg-white rounded-2xl border border-stone-200 shadow-xs p-3 min-h-0 overflow-hidden">
      <div class="flex items-center justify-between pb-2 border-b border-stone-200 shrink-0">
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-sm text-stone-900">Столы зала</span>
          <span id="busyBadge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-900">0 занято</span>
        </div>
        <span id="totalHallSum" class="font-mono font-black text-sm text-amber-950">0 ₽ в зале</span>
      </div>

      <!-- Tables Grid Container -->
      <div id="cashierTablesGrid" class="flex-1 overflow-y-auto scroll-touch pt-2 grid grid-cols-2 sm:grid-cols-3 gap-2 min-h-0">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- RIGHT: Active Bill Checkout -->
    <section class="lg:col-span-5 flex flex-col bg-white rounded-2xl border border-stone-200 shadow-xs p-3.5 min-h-0 overflow-hidden">
      
      <div class="flex items-center justify-between pb-2 border-b border-stone-200 shrink-0">
        <div>
          <span class="text-[10px] uppercase font-bold text-amber-800 bg-amber-100 px-1.5 py-0.5 rounded">Текущий расчёт</span>
          <h2 id="billTitle" class="font-extrabold text-base text-stone-900 mt-0.5">Выберите стол</h2>
        </div>
        <span id="billGuestsBadge" class="text-xs font-bold text-stone-600 bg-stone-100 px-2 py-1 rounded-lg">0 чел.</span>
      </div>

      <!-- Receipt items -->
      <div id="billItemsContainer" class="flex-1 overflow-y-auto scroll-touch py-2 space-y-1.5 min-h-0 font-mono text-xs">
        <div class="h-full flex flex-col items-center justify-center text-center text-stone-400">
          <span class="text-3xl mb-1">🧾</span>
          <p class="text-xs font-bold text-stone-600">Стол не выбран</p>
          <p class="text-[11px] text-stone-400">Нажмите на занятый стол слева для оплаты</p>
        </div>
      </div>

      <!-- Payment & Calculation Block -->
      <div id="paymentControlBlock" class="hidden border-t border-stone-200 pt-2.5 space-y-2 shrink-0">
        
        <!-- Total -->
        <div class="flex items-baseline justify-between bg-stone-50 p-2.5 rounded-xl border border-stone-200">
          <span class="font-bold text-xs uppercase text-stone-600">К оплате:</span>
          <span id="billTotalSum" class="font-mono font-black text-2xl text-amber-950">0 ₽</span>
        </div>

        <!-- Payment Method Tabs -->
        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="setPayMethod('card')" id="pay-card" class="pay-btn py-2 rounded-xl text-xs font-bold bg-stone-900 text-white shadow-2xs transition">
            💳 Карта
          </button>
          <button onclick="setPayMethod('cash')" id="pay-cash" class="pay-btn py-2 rounded-xl text-xs font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 transition">
            💵 Наличные
          </button>
          <button onclick="setPayMethod('sbp')" id="pay-sbp" class="pay-btn py-2 rounded-xl text-xs font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 transition">
            📱 СБП
          </button>
        </div>

        <!-- Cash change calculator -->
        <div id="cashCalcPanel" class="hidden bg-amber-50/70 border border-amber-200 p-2 rounded-xl space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-stone-700">Получено от гостя:</span>
            <input type="number" id="cashReceivedInput" oninput="calculateChange()" placeholder="0" class="w-28 text-right font-mono font-bold text-sm bg-white border border-stone-300 rounded-lg p-1.5 outline-none focus:ring-2 focus:ring-amber-600">
          </div>
          <div class="flex items-center justify-between text-xs pt-1 border-t border-amber-200/60">
            <span class="font-bold text-stone-600">Сдача:</span>
            <span id="cashChangeVal" class="font-mono font-black text-sm text-emerald-800">0 ₽</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="copyCurrentBill()" class="py-2.5 px-2 bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-bold rounded-xl border border-stone-300 flex items-center justify-center gap-1 active:scale-95 transition">
            <span>📋</span> <span>Чек</span>
          </button>
          <button onclick="closeAndFreeTable()" class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-xs font-bold rounded-xl shadow-xs flex items-center justify-center gap-1 active:scale-95 transition">
            <span>✓</span> <span>Оплачено</span>
          </button>
        </div>

      </div>

    </section>

  </main>

  <!-- Script -->
  <script type="module">
    import { initFirebaseAuth, subscribeToCloudTables, saveTablesToCloud } from "./firebase.js";
    import { TABLES_INITIAL, calcTableSum } from "./menu.js";

    let tables = TABLES_INITIAL;
    let selectedTableId = null;
    let payMethod = 'card';

    function renderTablesGrid() {
      const grid = document.getElementById('cashierTablesGrid');
      if (!grid) return;
      grid.innerHTML = '';

      let busyCount = 0;
      let totalSum = 0;

      tables.forEach(t => {
        const sum = calcTableSum(t);
        const hasItems = t.items && t.items.length > 0;
        if (hasItems) {
          busyCount++;
          totalSum += sum;
        }

        const isSelected = selectedTableId === t.id;
        const totalCount = hasItems ? t.items.reduce((s, it) => s + it.qty, 0) : 0;
        const servedCount = hasItems ? t.items.filter(it => it.served).reduce((s, it) => s + it.qty, 0) : 0;

        const card = document.createElement('div');
        const activeBorder = isSelected ? 'ring-2 ring-amber-600 border-amber-600' : 'border-stone-200';
        const cardBg = hasItems ? 'bg-amber-50/70 hover:bg-amber-100/70' : 'bg-stone-50 hover:bg-stone-100 opacity-70';

        card.className = `p-3 rounded-2xl border ${activeBorder} ${cardBg} flex flex-col justify-between cursor-pointer transition select-none btn-press`;
        card.onclick = () => selectTable(t.id);

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <span class="font-extrabold text-sm text-stone-900">${t.name}</span>
              <div class="text-[10px] text-stone-500 font-semibold">${t.waiter ? `👤 ${t.waiter}` : 'Свободен'}</div>
            </div>
            <span class="w-6 h-6 rounded-lg ${hasItems ? 'bg-amber-600 text-white' : 'bg-stone-200 text-stone-600'} text-[11px] font-black font-mono flex items-center justify-center">
              ${t.id}
            </span>
          </div>

          <div class="mt-2 pt-2 border-t border-stone-200/60 flex items-end justify-between">
            <span class="text-[10px] font-bold ${hasItems ? 'text-amber-800' : 'text-stone-400'}">
              ${hasItems ? `✓ ${servedCount}/${totalCount}` : '—'}
            </span>
            <span class="font-mono font-black text-sm ${sum > 0 ? 'text-stone-900' : 'text-stone-400'}">
              ${sum} ₽
            </span>
          </div>
        `;
        grid.appendChild(card);
      });

      const busyBadge = document.getElementById('busyBadge');
      const totalHallSum = document.getElementById('totalHallSum');
      if (busyBadge) busyBadge.textContent = `${busyCount} занято`;
      if (totalHallSum) totalHallSum.textContent = `${totalSum} ₽ в зале`;
    }

    function selectTable(id) {
      selectedTableId = id;
      renderTablesGrid();
      renderActiveBill();
    }

    function renderActiveBill() {
      const table = tables.find(t => t.id === selectedTableId);
      const titleEl = document.getElementById('billTitle');
      const guestsEl = document.getElementById('billGuestsBadge');
      const itemsContainer = document.getElementById('billItemsContainer');
      const paymentBlock = document.getElementById('paymentControlBlock');
      const totalSumEl = document.getElementById('billTotalSum');

      if (!table || !table.items || table.items.length === 0) {
        if (titleEl) titleEl.textContent = table ? `${table.name} (Пуст)` : 'Выберите стол';
        if (guestsEl) guestsEl.textContent = '0 чел.';
        if (paymentBlock) paymentBlock.classList.add('hidden');
        if (itemsContainer) {
          itemsContainer.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-center text-stone-400">
              <span class="text-3xl mb-1">☕</span>
              <p class="text-xs font-bold text-stone-600">${table ? 'Заказ стола пуст' : 'Стол не выбран'}</p>
            </div>
          `;
        }
        return;
      }

      if (titleEl) titleEl.textContent = `${table.name} • ${table.waiter || 'Официант'}`;
      if (guestsEl) guestsEl.textContent = `${table.guests || 1} чел.`;
      if (paymentBlock) paymentBlock.classList.remove('hidden');

      const sum = calcTableSum(table);
      if (totalSumEl) totalSumEl.textContent = `${sum} ₽`;

      if (itemsContainer) {
        itemsContainer.innerHTML = '';
        table.items.forEach((it, idx) => {
          const row = document.createElement('div');
          row.className = "flex justify-between items-start py-1 border-b border-stone-100 last:border-0";
          const modsText = it.modifiers && it.modifiers.length > 0 ? `<div class="text-[10px] text-stone-500 font-sans">+ ${it.modifiers.join(', ')}</div>` : '';

          row.innerHTML = `
            <div class="pr-2">
              <span class="font-sans font-bold text-stone-800">${idx + 1}. ${it.name}</span>
              <div class="text-stone-500">${it.qty} × ${it.price} ₽</div>
              ${modsText}
            </div>
            <div class="font-bold text-stone-900 shrink-0">${it.qty * it.price} ₽</div>
          `;
          itemsContainer.appendChild(row);
        });
      }

      calculateChange();
    }

    window.setPayMethod = (method) => {
      payMethod = method;
      document.querySelectorAll('.pay-btn').forEach(btn => {
        btn.className = "pay-btn py-2 rounded-xl text-xs font-bold bg-stone-100 text-stone-700 hover:bg-stone-200 transition";
      });
      const active = document.getElementById(`pay-${method}`);
      if (active) {
        active.className = "pay-btn py-2 rounded-xl text-xs font-bold bg-stone-900 text-white shadow-2xs transition";
      }

      const cashPanel = document.getElementById('cashCalcPanel');
      if (cashPanel) {
        if (method === 'cash') cashPanel.classList.remove('hidden');
        else cashPanel.classList.add('hidden');
      }
    };

    window.calculateChange = () => {
      const table = tables.find(t => t.id === selectedTableId);
      if (!table) return;
      const total = calcTableSum(table);
      const input = document.getElementById('cashReceivedInput');
      const changeEl = document.getElementById('cashChangeVal');
      const received = parseFloat(input?.value) || 0;
      const change = Math.max(0, received - total);
      if (changeEl) changeEl.textContent = `${change} ₽`;
    };

    window.copyCurrentBill = () => {
      const table = tables.find(t => t.id === selectedTableId);
      if (!table || !table.items) return;
      let text = `COFFEEMAN • КАССОВЫЙ ЧЕК\n${table.name} • ${new Date().toLocaleTimeString()}\n`;
      text += `Официант: ${table.waiter || '—'}\n--------------------------------\n`;
      table.items.forEach((it, i) => {
        text += `${i+1}. ${it.name} (${it.qty}x${it.price}) = ${it.qty*it.price} ₽\n`;
      });
      text += `--------------------------------\nИТОГО: ${calcTableSum(table)} ₽\nОплата: ${payMethod.toUpperCase()}`;
      navigator.clipboard.writeText(text);
      alert('Чек скопирован в буфер обмена!');
    };

    window.closeAndFreeTable = () => {
      const table = tables.find(t => t.id === selectedTableId);
      if (!table) return;

      const ok = confirm(`Закрыть чек и освободить ${table.name}?`);
      if (!ok) return;

      table.items = [];
      table.guests = 0;
      table.waiter = "";

      saveTablesToCloud(tables, "Касса");
      selectedTableId = null;
      renderTablesGrid();
      renderActiveBill();
    };

    // Слушатель Firebase
    initFirebaseAuth(() => {
      subscribeToCloudTables((remoteTables) => {
        tables = remoteTables;
        renderTablesGrid();
        if (selectedTableId) renderActiveBill();
      });
    });
  </script>
</body>
</html>
