<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Оплата по QR — СБП</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 100%);
    }
  </style>
</head>
<body class="text-slate-800 flex flex-col items-center justify-center min-h-screen p-4 font-sans select-none">

  <!-- Основной контейнер-терминал -->
  <main class="w-full max-w-sm bg-white/95 backdrop-blur-md rounded-[32px] border border-blue-100 shadow-2xl p-6 relative overflow-hidden flex flex-col justify-between min-h-[640px]">
    
    <!-- Шапка -->
    <header class="flex items-center justify-between pb-3 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <!-- SVG логотип СБП -->
        <svg class="w-7 h-7" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.5 4L5 19.5L19.5 35L22 32.5L10 19.5L22 6.5L19.5 4Z" fill="#F36F21"/>
          <path d="M20.5 4L35 19.5L20.5 35L18 32.5L30 19.5L18 6.5L20.5 4Z" fill="#1475BA"/>
          <path d="M12 19.5L19.5 12L27 19.5L19.5 27L12 19.5Z" fill="#2BB673"/>
          <path d="M19.5 12L27 19.5L19.5 27V12Z" fill="#B32B87"/>
        </svg>
        <div>
          <span class="font-extrabold text-sm tracking-tight text-blue-950 block leading-tight">Система Быстрых</span>
          <span class="font-bold text-xs text-blue-600 block tracking-wider uppercase">Платежей</span>
        </div>
      </div>

      <!-- Кнопка Настроек -->
      <button id="openSettingsBtn" class="p-2.5 rounded-2xl bg-blue-50 hover:bg-blue-100 text-blue-900 transition active:scale-95 shadow-sm">
        <i data-lucide="settings-2" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- Секция 1: Ввод суммы и клавиатура -->
    <section id="inputScreen" class="flex flex-col flex-1 justify-between pt-4">
      <div class="text-center my-auto bg-gradient-to-b from-blue-50/70 to-indigo-50/30 p-4 rounded-3xl border border-blue-100/60 shadow-inner">
        <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Сумма к оплате</span>
        <div class="flex items-baseline justify-center gap-1 mt-1">
          <span id="amountDisplay" class="text-4xl font-black tracking-tight text-blue-950">0</span>
          <span class="text-2xl font-bold text-blue-600">₽</span>
        </div>
      </div>

      <!-- Цифровая клавиатура (Numpad) -->
      <div class="grid grid-cols-3 gap-2.5 my-4">
        <button onclick="pressKey('1')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">1</button>
        <button onclick="pressKey('2')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">2</button>
        <button onclick="pressKey('3')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">3</button>
        <button onclick="pressKey('4')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">4</button>
        <button onclick="pressKey('5')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">5</button>
        <button onclick="pressKey('6')" class="h-13 py-3 rounded-2xl bg-slate-700 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">6</button>
        <button onclick="pressKey('7')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">7</button>
        <button onclick="pressKey('8')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">8</button>
        <button onclick="pressKey('9')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">9</button>
        <button onclick="pressKey('C')" class="h-13 py-3 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-500 font-bold transition active:scale-95 border border-rose-100">C</button>
        <button onclick="pressKey('0')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 text-xl font-bold text-slate-700 transition active:scale-95 border border-slate-100">0</button>
        <button onclick="pressKey('backspace')" class="h-13 py-3 rounded-2xl bg-slate-50 hover:bg-blue-50 flex items-center justify-center text-slate-600 transition active:scale-95 border border-slate-100">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Кнопка создания -->
      <button id="generateBtn" onclick="createPaymentQR()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-base shadow-lg shadow-blue-500/25 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <span id="btnText">Создать QR-код</span>
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </button>
    </section>

    <!-- Секция 2: Экран платежного стикера СБП -->
    <section id="qrScreen" class="hidden flex flex-col flex-1 justify-between items-center pt-2">
      <!-- Белый стикер -->
      <div class="w-full bg-slate-50 rounded-3xl p-5 border border-slate-200/80 shadow-md flex flex-col items-center relative my-auto">
        <h2 class="text-xl font-black text-blue-950 tracking-tight">Плати по-новому!</h2>
        <p class="text-[11px] font-semibold text-slate-500 text-center mt-1 max-w-[210px] leading-snug">
          Отсканируйте в приложении любого банка для оплаты
        </p>

        <!-- QR-контейнер со значком NFC в центре -->
        <div class="relative p-3 bg-white rounded-2xl border border-slate-200 shadow-sm mt-3.5 mb-3 flex items-center justify-center">
          <div id="qrcode"></div>
          
          <!-- Пиктограмма волны/бесконтактной оплаты в центре -->
          <div class="absolute inset-0 m-auto w-9 h-9 bg-white rounded-full flex items-center justify-center shadow-md border border-slate-100 pointer-events-none">
            <svg class="w-5 h-5 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 8.5C6 4.5 12 4.5 16 8.5"/>
              <path d="M5 12C8 9 13 9 16 12"/>
              <path d="M8.5 15.5C10.5 13.5 13.5 13.5 15.5 15.5"/>
            </svg>
          </div>
        </div>

        <div class="text-2xl font-black text-blue-950 mb-3">
          <span id="qrAmount">0</span> ₽
        </div>

        <!-- Нижний блок логотипа СБП -->
        <div class="w-full pt-3 border-t border-slate-200/60 flex items-center justify-center gap-2">
          <svg class="w-6 h-6" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.5 4L5 19.5L19.5 35L22 32.5L10 19.5L22 6.5L19.5 4Z" fill="#F36F21"/>
            <path d="M20.5 4L35 19.5L20.5 35L18 32.5L30 19.5L18 6.5L20.5 4Z" fill="#1475BA"/>
            <path d="M12 19.5L19.5 12L27 19.5L19.5 27L12 19.5Z" fill="#2BB673"/>
            <path d="M19.5 12L27 19.5L19.5 27V12Z" fill="#B32B87"/>
          </svg>
          <span class="font-extrabold text-xs text-blue-950 uppercase tracking-wide">Система быстрых платежей</span>
        </div>
      </div>

      <!-- Кнопка отмены -->
      <button onclick="cancelPayment()" class="w-full mt-3 py-3 rounded-2xl bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 font-bold text-sm border border-slate-200 transition active:scale-[0.98]">
        Отменить оплату
      </button>
    </section>

    <!-- Модалка настроек -->
    <div id="settingsModal" class="hidden absolute inset-0 bg-white/95 backdrop-blur-md p-6 flex flex-col justify-between z-50">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h2 class="text-base font-extrabold text-blue-950 flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-blue-600"></i>
            Настройки ЮKassa
          </h2>
          <button id="closeSettingsBtn" class="p-1 text-slate-400 hover:text-slate-700">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="space-y-4 mt-6">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Shop ID</label>
            <input id="shopIdInput" type="text" placeholder="1350725" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 font-medium transition text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Секретный ключ (API Key)</label>
            <input id="secretKeyInput" type="password" placeholder="live_... или test_..." class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 font-medium transition text-sm" />
          </div>
        </div>
      </div>

      <button onclick="saveSettings()" class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-md shadow-blue-500/20 transition active:scale-[0.98]">
        Сохранить в телефоне
      </button>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const WORKER_URL = 'https://green-glade-501c.dalordjot.workers.dev';

    let currentAmount = '0';
    let checkInterval = null;

    const amountDisplay = document.getElementById('amountDisplay');
    const inputScreen = document.getElementById('inputScreen');
    const qrScreen = document.getElementById('qrScreen');
    const qrAmount = document.getElementById('qrAmount');
    const settingsModal = document.getElementById('settingsModal');
    const shopIdInput = document.getElementById('shopIdInput');
    const secretKeyInput = document.getElementById('secretKeyInput');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');

    window.addEventListener('DOMContentLoaded', () => {
      shopIdInput.value = localStorage.getItem('yk_shop_id') || '';
      secretKeyInput.value = localStorage.getItem('yk_secret_key') || '';
    });

    function pressKey(key) {
      if (key === 'C') {
        currentAmount = '0';
      } else if (key === 'backspace') {
        currentAmount = currentAmount.length > 1 ? currentAmount.slice(0, -1) : '0';
      } else {
        if (currentAmount === '0') {
          currentAmount = key;
        } else if (currentAmount.length < 7) {
          currentAmount += key;
        }
      }
      amountDisplay.textContent = Number(currentAmount).toLocaleString('ru-RU');
    }

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    async function createPaymentQR() {
      const amount = parseInt(currentAmount, 10);
      if (isNaN(amount) || amount <= 0) {
        alert('Введите корректную сумму');
        return;
      }

      const shopId = localStorage.getItem('yk_shop_id') || shopIdInput.value.trim();
      const secretKey = localStorage.getItem('yk_secret_key') || secretKeyInput.value.trim();

      if (!shopId || !secretKey) {
        alert('Укажите Shop ID и Секретный ключ в настройках!');
        settingsModal.classList.remove('hidden');
        return;
      }

      generateBtn.disabled = true;
      btnText.innerText = 'Создание...';

      const auth = btoa(`${shopId}:${secretKey}`);
      const idempotenceKey = generateUUID();

      try {
        const response = await fetch(`${WORKER_URL}/payments`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Basic ${auth}`,
            'Idempotence-Key': idempotenceKey
          },
          body: JSON.stringify({
            amount: {
              value: Number(amount).toFixed(2),
              currency: 'RUB'
            },
            payment_method_data: {
              type: 'sbp'
            },
            confirmation: {
              type: 'qr'
            },
            capture: true,
            description: `Оплата через СБП: ${amount} руб.`
          })
        });

        const data = await response.json();

        if (!response.ok) {
          alert('Ответ ЮKassa: ' + (data.description || data.error || 'Ошибка данных'));
          return;
        }

        const sbpUrl = data.confirmation?.confirmation_data;

        if (!sbpUrl) {
          alert('Платёж создан, но ЮKassa не вернула ссылку СБП.');
          return;
        }

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';

        new QRCode(qrContainer, {
          text: sbpUrl,
          width: 175,
          height: 175,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });

        qrAmount.textContent = Number(currentAmount).toLocaleString('ru-RU');
        inputScreen.classList.add('hidden');
        qrScreen.classList.remove('hidden');

        startPolling(data.id, auth);

      } catch (err) {
        alert('Ошибка связи: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'Создать QR-код';
      }
    }

    function startPolling(paymentId, auth) {
      if (checkInterval) clearInterval(checkInterval);

      checkInterval = setInterval(async () => {
        try {
          const res = await fetch(`${WORKER_URL}/payments/${paymentId}`, {
            headers: { 'Authorization': `Basic ${auth}` }
          });
          const data = await res.json();

          if (data.status === 'succeeded') {
            clearInterval(checkInterval);
            alert('🎉 Оплата успешно получена!');
            cancelPayment();
          } else if (data.status === 'canceled') {
            clearInterval(checkInterval);
            alert('Платеж отменен.');
            cancelPayment();
          }
        } catch (e) {
          console.error(e);
        }
      }, 3000);
    }

    function cancelPayment() {
      if (checkInterval) clearInterval(checkInterval);
      qrScreen.classList.add('hidden');
      inputScreen.classList.remove('hidden');
      currentAmount = '0';
      amountDisplay.textContent = '0';
    }

    document.getElementById('openSettingsBtn').addEventListener('click', () => settingsModal.classList.remove('hidden'));
    document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.add('hidden'));

    function saveSettings() {
      localStorage.setItem('yk_shop_id', shopIdInput.value.trim());
      localStorage.setItem('yk_secret_key', secretKeyInput.value.trim());
      settingsModal.classList.add('hidden');
      alert('Настройки сохранены!');
    }
  </script>
</body>
</html>
